server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ASTRO Match — rutas estáticas propias (sin fallback al landing)
    location /match/ {
        try_files $uri $uri/ $uri/index.html =404;
    }

    location = /match/sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location /admin/ {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Landing y resto del sitio
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    # Proxy para Insforge (Red Interna Docker)
    location /api/insforge/ {
        proxy_pass http://insforge_postgrest:3000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WhatsApp notify (Evolution API)
    location /api/notify/ {
        set $upstream http://astro-notify:8789;
        rewrite ^/api/notify/?(.*)$ /$1 break;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 15s;
        proxy_read_timeout 30s;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
