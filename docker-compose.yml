version: "3.8"

services:
  astro-web:
    build:
      context: ./site
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_INSFORGE_API_URL=${NEXT_PUBLIC_INSFORGE_API_URL:-/api/insforge}
        - NEXT_PUBLIC_NOTIFY_SECRET=${NOTIFY_SECRET:-}
    image: astro-web:latest
    environment:
      - NEXT_PUBLIC_INSFORGE_API_URL=${NEXT_PUBLIC_INSFORGE_API_URL:-/api/insforge}
      - INSFORGE_JWT_SECRET=${INSFORGE_JWT_SECRET}
    networks:
      - RenaceNet
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
      labels:
        - "traefik.enable=true"
        # HTTP Router
        - "traefik.http.routers.astro_sdq_http.rule=Host(`astro.renace.tech`)"
        - "traefik.http.routers.astro_sdq_http.entrypoints=web"
        - "traefik.http.routers.astro_sdq_http.middlewares=astro_sdq_redirect_https"
        # Middleware: Redirect to HTTPS
        - "traefik.http.middlewares.astro_sdq_redirect_https.redirectscheme.scheme=https"
        # HTTPS Router
        - "traefik.http.routers.astro_sdq_secure.rule=Host(`astro.renace.tech`)"
        - "traefik.http.routers.astro_sdq_secure.entrypoints=websecure"
        - "traefik.http.routers.astro_sdq_secure.tls=true"
        - "traefik.http.routers.astro_sdq_secure.tls.certresolver=letsencryptresolver"
        # Service Port
        - "traefik.http.services.astro_sdq_svc.loadbalancer.server.port=80"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  notify:
    image: astro-notify:latest
    build:
      context: ./services/notify
      dockerfile: Dockerfile
    environment:
      PORT: "8789"
      NOTIFY_SECRET: ${NOTIFY_SECRET:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-2BK2}
      ADMIN_WHATSAPP: ${ADMIN_WHATSAPP:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-astrsdq@gmail.com}
      EVOLUTION_API_URL: ${EVOLUTION_API_URL:-https://evoapi.renace.tech}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-}
      EVOLUTION_INSTANCE: ${EVOLUTION_INSTANCE:-renace}
      SMTP_HOST: ${SMTP_HOST:-smtp.hostinger.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-info@renace.tech}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-info@renace.tech}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-ASTRO SDQ}
      SMTP_REPLY_TO: ${SMTP_REPLY_TO:-info@renace.tech}
      SMTP_PROFILE: ${SMTP_PROFILE:-hostinger}
      ASTRO_PROJECT_ID: ${ASTRO_PROJECT_ID:-ASTRO_SDQ_2027}
      ASTRO_EDITION: ${ASTRO_EDITION:-5TA EDICIÓN · 2027}
      SITE_URL: ${SITE_URL:-https://astro.renace.tech}
      LEADS_API_URL: ${LEADS_API_URL:-http://insforge_postgrest:3000/leads}
      WEEKLY_REPORT_DAY: ${WEEKLY_REPORT_DAY:-1}
      WEEKLY_REPORT_HOUR: ${WEEKLY_REPORT_HOUR:-9}
    networks:
      RenaceNet:
        aliases:
          - astro-notify
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

networks:
  RenaceNet:
    external: true
